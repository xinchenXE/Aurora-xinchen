# 您可以根据下面内容来对nacos创建配置
server:
  port: 8080

# JWT 签名密钥（Base64 编码，至少 32 字节随机数），生产环境必须填写，禁止写入源码
auth:
  secret:
  # JWT 签发者标识（可选，默认 aurora）
  issuer: aurora

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://ip:3306/aurora?serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: 
    password: 
    druid:
      initialSize: 5
      minIdle: 5
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙，此处是filter修改的地方
      filter:
        commons-log:
          connection-logger-name: stat,wall,knife4j
        # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 合并多个DruidDataSource的监控数据
      useGlobalDataSourceStat: true

  # Boot 3: spring.redis.* -> spring.data.redis.*
  data:
    redis:
      host: 
      port: 6379
      password: 
      database: 1
      lettuce:
        pool:
          max-idle: 100
          max-active: 100
          max-wait: 10000
          min-idle: 10

  rabbitmq:
    host: 
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000

  elasticsearch:
    # Boot 3: spring.elasticsearch.rest.uris -> spring.elasticsearch.uris
    uris:
  mail:
    host: smtp.exmail.qq.com
    username: 
    password: 
    default-encoding: UTF-8
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # HTTP 客户端超时：限制 AI（及其他 RestClient）调用的连接/读取时长，避免供应商不可达时无限挂起
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s

  # Spring AI 多模型兼容（OpenAI 协议）：可对接任意提供 OpenAI 兼容接口的厂商/本地服务，
  # 只需改 base-url / api-key / model 三处，无需改代码；也可在 /ai/chat 请求里用 model 参数单次临时切换模型。
  # 常见示例（默认请求路径为 /v1/chat/completions，可用 spring.ai.openai.chat.completions-path 覆盖）：
  #   OpenAI:    base-url: https://api.openai.com          model: gpt-4o-mini
  #   DeepSeek:  base-url: https://api.deepseek.com        model: deepseek-chat / deepseek-reasoner
  #   Kimi:      base-url: https://api.moonshot.cn         model: moonshot-v1-8k
  #   智谱 GLM:  base-url: https://open.bigmodel.cn/api/paas/v4  model: glm-4-flash（需同时设 completions-path: /chat/completions）
  #   Ollama 本地: base-url: http://127.0.0.1:11434        model: llama3.1（api-key 随意填，如 ollama）
  ai:
    openai:
      base-url: https://api.openai.com
      # 占位符：使用 /ai/chat 前请替换为真实 API Key
      api-key: 'sk-placeholder-configure-your-key'
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    # AI 调用快速失败重试：Spring AI 默认 10 次重试+指数退避，供应商不可达时单条请求可挂起十余分钟
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1000
        multiplier: 2
        max-interval: 5000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

search:
  mode: elasticsearch

upload:
  mode: minio
  oss:
    url: 
    endpoint: 
    accessKeyId: 
    accessKeySecret: 
    bucketName: 
  minio:
    url: 
    endpoint: 
    accesskey: 
    secretKey: 
    bucketName: 

knife4j:
  enable: true
  production: true


website:
  url: 

qq:
  # QQ 互联 AppID：必须与前台 aurora-blog/src/config/config.ts 的 QQ_APP_ID 一致
  app-id: 102036183
  check-token-url: https://graph.qq.com/oauth2.0/me?access_token={access_token}
  user-info-url: https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}

# Aurora AI 对话（可选，Nacos 热更新；不配置时代码内有默认值）
aurora:
  ai:
    chat:
      # 默认角色名称（后台「AI人设设置」配置后以后台为准）
      role-name: 爱莉希雅
      # 默认开场白（后台「AI人设设置」配置后以后台为准）
      greeting: 嗨~ 想我了嘛🎶，爱莉希雅一直在这里哦~~~
      # 基础系统提示词（默认人设）；请求携带 rolePrompt 时，角色扮演要求会自动附加在其后
      system-prompt: 你是 Aurora 博客的 AI 助手，回答简洁、准确、友好。

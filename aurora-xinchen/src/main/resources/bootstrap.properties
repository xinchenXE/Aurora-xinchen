spring.application.name=nacos
spring.profiles.active=cloud
# SCA 2025.x 需要显式声明 Nacos 配置导入（旧版引导上下文自动加载已废弃）
# optional: 前缀：配置刷新时 Nacos 资源短暂缺失不再导致进程崩溃（2026-08-13 曾因 ConfigDataResourceNotFoundException 触发 APPLICATION FAILED TO START）
spring.config.import=optional:nacos:application-cloud.yml?group=DEFAULT_GROUP&refreshEnabled=true
# 本地测试环境 Nacos（2026-08-09 搭建；2026-08-09 升级至 Nacos 3.2.3，命名空间 ID 由 3.x 自动生成为 UUID）
# 端口平移说明（2026-08-15）：宿主机 9848/9849 被 Hyper-V 动态端口保留占用，
# Nacos 容器改为 宿主 8300->8848（HTTP）、9300->9848（gRPC，客户端按 主端口+1000 计算）、8880->控制台。
# ES 传输端口（9300）在宿主机改映射为 9301；后端只连 ES 的 HTTP 9200。
# 若已用管理员 netsh 为 8848/9848 添加永久保留并重建容器，可改回 127.0.0.1:8848。
spring.cloud.nacos.config.namespace=000b0591-227e-4f9a-890f-9b1af410b232
spring.cloud.nacos.discovery.namespace=000b0591-227e-4f9a-890f-9b1af410b232
spring.cloud.nacos.config.server-addr=127.0.0.1:8300
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8300
spring.cloud.nacos.config.file-extension=yml
spring.cloud.nacos.config.prefix=application
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
# 凭据外置（2026-09-30，队列项 012 / ISS-007）：真实口令不再入库。
# 本地注入方式（任选其一，Spring 的标准外部化优先级即可生效）：
#   ① 环境变量：set NACOS_PASSWORD=<口令>   （PowerShell: $env:NACOS_PASSWORD='<口令>'）
#   ② 环境变量 SPRING_APPLICATION_JSON：{"spring.cloud.nacos.config.password":"<口令>"}
# 阶段 2（不在本轮）：生产改宿主环境变量注入，与部署窗口协调后单独授权。
spring.cloud.nacos.config.password=${NACOS_PASSWORD:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}
spring.cloud.nacos.config.refresh-enabled=true
# 注意事项：config项为配置中心项，如果您一定要使用nacos作为配置中心，那这个为必须配置项，discovery为服务发现配置项，如果您使用服务注册功能，则请配置该项，如不使用请删除对应配置

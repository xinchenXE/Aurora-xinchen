name: Aurora CI

on:
  # 2026-11-09：改为仅手动触发。原 push 触发会在每次同步 main 时自动构建并推送镜像、
  # 远程重启生产容器；在 Secrets（Docker 账号 / 两台主机）与服务器更新脚本就绪前
  # 每次推送都会失败（run 42578397586 实测）。配好 Secrets 后可恢复 push 触发。
  #   push:
  #     branches: ["main"]
  workflow_dispatch:

jobs:
  aurora-xinchen-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: |
          cd aurora-xinchen
          mvn -B -ntp package --file pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          push: true
          context: aurora-xinchen
          tags: ${{secrets.DOCKER_USERNAME}}/aurora-xinchen:latest
          file: aurora-xinchen/Dockerfile

      - name: Update aurora-xinchen container
        run:
          sshpass -p ${{secrets.REMOTE_HOST_B_PASSWORD}} ssh -o StrictHostKeyChecking=no
          root@${{secrets.REMOTE_HOST_B_IP}} "cd /usr/local/aurora-xinchen && sh aurora-xinchen.sh"

  aurora-vue-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            aurora-blog/package-lock.json
            aurora-admin/package-lock.json

      - name: Install aurora-blog dependencies
        run: |
          cd aurora-blog
          npm ci

      - name: Build aurora-blog
        run: |
          cd aurora-blog
          npm run build

      - name: Install aurora-admin dependencies
        run: |
          cd aurora-admin
          npm ci

      - name: Build aurora-admin
        run: |
          cd aurora-admin
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          tags: ${{ secrets.DOCKER_USERNAME }}/aurora-vue:latest
          file: Dockerfile.frontend

      - name: HostB transfer aurora-vue to tencent-registery
        run:
          sshpass -p ${{secrets.REMOTE_HOST_B_PASSWORD}} ssh -o StrictHostKeyChecking=no
          root@${{secrets.REMOTE_HOST_B_IP}} "cd /usr/local/aurora-vue && sh aurora-vue.sh"

      - name: Update aurora-vue container
        run:
          sshpass -p ${{secrets.REMOTE_HOST_A_PASSWORD}} ssh -o StrictHostKeyChecking=no
          root@${{secrets.REMOTE_HOST_A_IP}} "cd /usr/local/aurora-vue && sh aurora-vue.sh"
